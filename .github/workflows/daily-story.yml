name: Daily AI Story

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app.py

      - name: Generate Voice-over and Video
        run: python make_video.py

      - name: Upload to YouTube (only when credentials are configured)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_youtube.py

      - name: Save Story and Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-story-world-video
          path: |
            story.txt
            output/
          if-no-files-found: error
          retention-days: 7
