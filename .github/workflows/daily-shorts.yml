name: Daily AI Story Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth requests
      - name: Generate a NEW silent 3D fight story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app_short.py
      - name: Render NEW 3D Stickman Fight Short
        run: blender -b -t 2 --python make_shorts_3d.py
      - name: Upload NEW YouTube Short (PUBLIC)
        if: hashFiles('output/ai_story_short.mp4') != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_shorts.py
      - name: Save generated Short
        if: always() && hashFiles('output/ai_story_short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-story-world-3d-short
          path: |
            story.txt
            output/
          if-no-files-found: error
          retention-days: 7
